name: Sync travel itinerary
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: travel-itinerary-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.TRAVEL_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate itinerary
        env:
          TRAVEL_API_URL: ${{ vars.TRAVEL_API_URL }}
        run: python3 scripts/sync_itinerary.py
      - name: Commit updated itinerary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync itinerary data'
            git push
          fi
